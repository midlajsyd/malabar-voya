<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome — MalabarVoyages</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
    *{ box-sizing:border-box; }
    body{
        font-family:'Inter', sans-serif;
        margin:0;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:
            linear-gradient(135deg, rgba(6, 26, 14, 0.75), rgba(11, 54, 31, 0.85)),
            url('alappy.jpeg');
        background-size:cover;
        background-position:center;
        padding:30px;
    }
    
    /* ലോഗിൻ കാർഡിന് മാച്ചാകുന്ന പ്രീമിയം ശൈലി */
    .thanks-card{
        background: rgba(253, 248, 240, 0.98);
        border-radius: 28px;
        padding: 50px 40px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 40px 90px rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.5);
    }
    
    /* ഗോൾഡൻ സ്റ്റാർസ് ഇഫക്റ്റോട് കൂടിയ ഐക്കൺ */
    .thanks-icon{
        width: 70px; height: 70px;
        background: #0b361f;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        color: #d4a24c; font-size: 2rem;
        margin: 0 auto 24px;
        box-shadow: 0 8px 20px rgba(11, 54, 31, 0.2);
        position: relative;
    }
    
    .thanks-card h1{ 
        font-size: 1.8rem; 
        color: #14290f; 
        font-weight: 800; 
        margin-bottom: 12px; 
        letter-spacing: -0.5px;
    }
    
    .thanks-card p{ 
        color: #656e66; 
        font-size: .95rem; 
        line-height: 1.6;
        margin-bottom: 30px; 
    }
    
    /* മെയിൻ ബട്ടൺ ഡിസൈൻ */
    a.btn-home{
        display: inline-block;
        background: #0b361f; 
        color: #fff;
        padding: 13px 35px; 
        border-radius: 50px;
        text-decoration: none; 
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(11, 54, 31, 0.2);
    }
    
    a.btn-home:hover{ 
        background: #0e4a2b; 
        color: #fff; 
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(14, 110, 25, 0.25);
    }
    
    .thanks-note {
        font-size: 0.78rem;
        color: #8a8476;
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid #e2ddd0;
    }
</style>
</head>
<body>
  <div class="thanks-card">
    <div class="thanks-icon">
        <i class="bi bi-stars"></i>
    </div>
    <h1>You're on the list!</h1>
    <p>Thanks for signing up with MalabarVoyages. Our travel desk will reach out within 24 hours to help plan your perfect trip.</p>
    <a href="traveling.html" class="btn-home"><i class="bi bi-arrow-left me-2"></i>Back to Home</a>
    
    <div class="thanks-note">
        <i class="bi bi-shield-check text-success"></i> Secure confirmation via Formspree desk.
    </div>
  </div>
</body>
</html>
